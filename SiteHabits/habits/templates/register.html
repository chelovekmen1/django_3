<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация — SiteHabits</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #f7f9fc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 400px;
        }
        h1 { font-size: 22px; margin-bottom: 20px; color: #1a1a1a; text-align: center; }
        form p { margin-bottom: 15px; }
        form label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 13px; color: #555; }
        form input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }
        form input:focus { border-color: #4f46e5; }
        .helptext, ul.errorlist { font-size: 12px; color: #666; margin-top: 4px; list-style: none; }
        ul.errorlist { color: #dc2626; }
        .btn-submit {
            background-color: #4f46e5;
            color: white;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        .btn-submit:hover { background-color: #4338ca; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Регистрация в SiteHabits</h1>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-submit">Зарегистрироваться</button>
        </form>
        <div style="text-align: center; margin-top: 15px; font-size: 13px;">
            Уже есть аккаунт? <a href="/login/" style="color: #4f46e5; text-decoration: none;">Войти</a>
        </div>
    </div>
</body>
</html>
